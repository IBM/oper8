name: PR-1 · DAG Runner

on:
  push:
    branches: ["rewrite/DAG_Runner"]
    paths: ["rewrite/**"]
  pull_request:
    branches: ["main"]
    paths: ["rewrite/**"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: rewrite/go.sum

      - name: Download modules
        working-directory: rewrite
        run: go mod download

      - name: Build
        working-directory: rewrite
        run: go build ./...

      - name: Test with race detector
        working-directory: rewrite
        run: go test -race -count=1 -timeout=60s ./dag/...

      - name: Vet
        working-directory: rewrite
        run: go vet ./dag/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: rewrite/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: rewrite
          args: ./dag/...
