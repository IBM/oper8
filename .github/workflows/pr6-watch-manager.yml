name: PR-6 Watch Manager + CRD Codegen

on:
  push:
    branches: ["rewrite/Watch_Manager"]
    paths: ["rewrite/**"]
  pull_request:
    branches: ["main"]
    paths: ["rewrite/**"]

# golangci-lint v1.64.8 is compiled with Go 1.24.
# It hard-fails (exit 3) when the module declares go > 1.24.
# We pin the language version here and forcibly patch go.mod in every job
# so that no external process can break CI by bumping the directive.
env:
  GO_VERSION: "1.23.0"
  REQUIRED_GO_MOD_VERSION: "1.23.0"

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      # Force go.mod to the required language version BEFORE setup-go reads it.
      # This neutralises any external tool that bumps the directive on commit.
      - name: Pin go.mod language version
        working-directory: rewrite
        run: sed -i "s|^go [0-9][0-9.]*|go ${{ env.REQUIRED_GO_MOD_VERSION }}|" go.mod

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - name: go mod tidy
        run: go mod tidy

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      # Same forced patch — lint job must see go 1.23.0 or golangci-lint exits 3.
      - name: Pin go.mod language version
        working-directory: rewrite
        run: sed -i "s|^go [0-9][0-9.]*|go ${{ env.REQUIRED_GO_MOD_VERSION }}|" go.mod

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: rewrite

  manifests-verify:
    name: Manifests up-to-date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      - name: Pin go.mod language version
        working-directory: rewrite
        run: sed -i "s|^go [0-9][0-9.]*|go ${{ env.REQUIRED_GO_MOD_VERSION }}|" go.mod

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - name: Run controller-gen to regenerate CRDs
        run: make manifests

      - name: Verify no CRD drift
        run: git diff --exit-code config/crd/
