name: PR-6 Watch Manager + CRD Codegen

on:
  push:
    branches: ["rewrite/Watch_Manager"]
    paths: ["rewrite/**"]
  pull_request:
    branches: ["main"]
    paths: ["rewrite/**"]

# Pin Go once here; all jobs inherit it.
# golangci-lint v1.64.8 is built with Go 1.24 and refuses to lint modules
# that declare a higher Go version. go 1.23.0 is the safe, stable ceiling.
env:
  GO_VERSION: "1.23.0"

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - name: Verify go.mod language version
        # Fail fast if something bumped go.mod above our ceiling.
        run: |
          MOD_VER=$(awk '/^go /{print $2}' go.mod)
          echo "go.mod declares: go $MOD_VER"
          if [[ "$MOD_VER" != "1.23.0" ]]; then
            echo "ERROR: go.mod must declare 'go 1.23.0'. Found: $MOD_VER"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          # v1.64.8 is built with Go 1.24; it refuses modules with go > 1.24.
          # Pinning go-version above ensures go.mod never declares 1.25+.
          version: v1.64.8
          working-directory: rewrite

  manifests-verify:
    name: Manifests up-to-date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - name: Run controller-gen to regenerate CRDs
        run: make manifests

      - name: Verify no CRD drift
        run: git diff --exit-code config/crd/
