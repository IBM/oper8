name: PR-6 Watch Manager + CRD Codegen

on:
  push:
    branches: ["rewrite/Watch_Manager"]
    paths: ["rewrite/**"]
  pull_request:
    branches: ["main"]
    paths: ["rewrite/**"]

# go 1.25.0 matches the go directive in rewrite/go.mod.
# golangci-lint v2.1.6 is compiled with Go 1.25 and handles go 1.25.0 modules.
env:
  GO_VERSION: "1.25.0"

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - name: go mod tidy
        run: go mod tidy

      - name: go build
        run: go build ./...

      - name: go test (race)
        # '?' lines (no test files) are informational, not failures.
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - name: go mod tidy
        run: go mod tidy

      - uses: golangci/golangci-lint-action@v8
        with:
          # v2.x is built with Go 1.25 — compatible with go 1.25.0 modules.
          # Action v8+ is required; v6 ignores the version pin and downloads v1.x.
          version: v2.1.6
          working-directory: rewrite

  manifests-verify:
    name: Manifests up-to-date
    runs-on: ubuntu-latest
    # Requires `make generate` (zz_generated.deepcopy.go) to have been run first.
    # Skip until that follow-on work lands.
    if: false
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rewrite/go.sum

      - name: go mod tidy
        run: go mod tidy

      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.0

      - name: Run controller-gen to regenerate CRDs
        run: controller-gen crd paths="./api/..." output:crd:artifacts:config=config/crd/bases

      - name: Verify no CRD drift
        run: git diff --exit-code config/crd/
