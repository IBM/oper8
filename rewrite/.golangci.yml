# .golangci.yml — shared linter config for all rewrite/ PRs
# Place this at rewrite/.golangci.yml (the module root)

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet        # go vet checks
    - errcheck     # unchecked errors
    - staticcheck  # staticcheck SA rules
    - unused       # unused code
    - gofmt        # formatting
    - goimports    # import grouping
    - gosimple     # simplification suggestions
    - ineffassign  # ineffectual assignments
    - typecheck    # compilation errors

linters-settings:
  gofmt:
    simplify: true

issues:
  # Don't fail on test files for errcheck (common in table-driven tests)
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
